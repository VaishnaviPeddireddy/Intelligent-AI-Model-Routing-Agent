apiVersion: apps/v1
kind: Deployment
metadata:
  name: neocloudz
spec:
  replicas: 2
  selector:
    matchLabels: {app: neocloudz}
  template:
    metadata:
      labels: {app: neocloudz}
    spec:
      containers:
        - name: api
          image: neocloudz:local
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: neocloudz
spec:
  selector: {app: neocloudz}
  ports:
    - port: 80
      targetPort: 8000
